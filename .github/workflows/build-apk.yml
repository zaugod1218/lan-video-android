name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LanTorrentVideo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  pc-server:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build Windows BitTorrent streaming engine
        shell: pwsh
        env:
          CGO_CFLAGS: "-std=gnu11 -O2 -g"
        run: |
          go install github.com/anacrolix/confluence@v1.16.0
          $goPath = go env GOPATH
          Copy-Item -LiteralPath "$goPath\bin\confluence.exe" `
            -Destination "pc-server\lan-torrent-engine.exe"

      - name: Upload Windows PC server
        uses: actions/upload-artifact@v4
        with:
          name: LanTorrentVideo-pc-server-windows
          path: |
            pc-server/lan-torrent-engine.exe
            pc-server/lan_torrent_server.py
            pc-server/one-click-server.ps1
            pc-server/一键启动服务.bat
            pc-server/requirements.txt
          if-no-files-found: error
          retention-days: 30
